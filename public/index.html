<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <!-- SVG favicon — copy favicon.svg into your /public folder -->
  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
  <!-- Fallback .ico for older browsers -->
  <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Theme color adapts to dark/light -->
  <meta name="theme-color" content="#1a73e8" />

  <!-- SEO meta tags -->
  <meta name="description"
    content="TextUtils — A powerful browser-based text utility platform. Transform, clean, analyze and extract text instantly. Supports uppercase, lowercase, reverse, slug generator, word frequency, email/URL extraction and more." />
  <meta name="keywords"
    content="text utils, text formatter, text tools, uppercase, lowercase, word count, slug generator, text cleaner, online text tool" />
  <meta name="author" content="Akanshu Jamwal" />

  <!-- Open Graph (for link previews) -->
  <meta property="og:title" content="TextUtils — Smart Text Processing Tool" />
  <meta property="og:description"
    content="Transform, clean, and analyze text instantly in your browser. No data leaves your device." />
  <meta property="og:type" content="website" />

  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

  <title>TextUtils — Smart Text Processing Tool</title>

  <!--
      Flash-of-wrong-theme prevention:
      Reads saved theme and applies BOTH to <html> and <body>
      BEFORE React hydrates, so there is zero flicker on load.
    -->
  <script>
    (function () {
      var t = localStorage.getItem("theme") || "light";
      document.documentElement.classList.add(t);
      document.body.classList.add(t);
    })();
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- Bootstrap JS bundle (includes Popper) — required for navbar toggler on mobile -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
